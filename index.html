<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        :root {
            --bg-deep: #06110E;
            --bg-mid: #0C2620;
            --mint: #3ED9A6;
            --mint-soft: rgba(62, 217, 166, 0.16);
            --paper: #F6F5F1;
            --muted: rgba(246, 245, 241, 0.62);
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background: var(--bg-deep);
            color: var(--paper);
        }
        body {
            background:
                radial-gradient(480px 380px at 15% 8%, rgba(62,217,166,0.20), transparent 60%),
                radial-gradient(420px 360px at 90% 30%, rgba(62,217,166,0.12), transparent 65%),
                linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-mid) 55%, var(--bg-deep) 100%);
            background-attachment: fixed;
        }
        .wrap { max-width: 440px; margin: 0 auto; padding: 2.5rem 1.25rem 3rem; }

        .avatar-wrap { display: flex; justify-content: center; margin-bottom: 1.1rem; }
        .avatar {
            width: 96px; height: 96px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(246,245,241,0.85);
        }
        .identity { text-align: center; margin-bottom: 1.6rem; }
        .identity h1 {
            font-family: 'Fraunces', serif;
            font-weight: 600;
            font-size: 1.5rem;
            margin: 0 0 0.15rem;
        }
        .identity .role {
            color: var(--mint);
            font-size: 0.85rem;
            font-weight: 500;
            margin: 0 0 0.3rem;
        }
        .identity .tagline { color: var(--muted); font-size: 0.9rem; margin: 0; }

        .icon-row {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.65rem;
            margin-bottom: 1.75rem;
        }
        .icon-badge {
            width: 46px; height: 46px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: rgba(246,245,241,0.08);
            border: 1px solid rgba(246,245,241,0.14);
            backdrop-filter: blur(6px);
            color: var(--paper);
            font-size: 1.15rem;
            text-decoration: none;
            transition: background 0.15s ease, transform 0.15s ease;
        }
        .icon-badge:active { transform: scale(0.94); background: var(--mint-soft); }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            margin-bottom: 1.75rem;
        }
        .gallery img {
            width: 100%; height: 92px;
            object-fit: cover;
            border-radius: 10px;
        }

        section { margin-bottom: 1.75rem; }
        section h2 {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--mint);
            margin: 0 0 0.75rem;
        }
        .list-row {
            display: flex;
            gap: 0.75rem;
            padding: 0.7rem 0;
            border-bottom: 1px solid rgba(246,245,241,0.1);
            font-size: 0.92rem;
        }
        .list-row:last-child { border-bottom: none; }
        .list-row .icon { color: var(--mint); width: 20px; text-align: center; }
        .list-row .name { font-weight: 600; }
        .list-row .desc { color: var(--muted); font-size: 0.85rem; margin-top: 0.1rem; }

        .map-frame { border-radius: 12px; overflow: hidden; border: 1px solid rgba(246,245,241,0.14); }

        .save-btn {
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
            width: 100%;
            background: var(--mint);
            color: #06110E;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 0.85rem;
            border-radius: 999px;
            text-decoration: none;
            border: none;
            margin-top: 0.5rem;
        }
        .save-btn:active { opacity: 0.85; }

        footer { text-align: center; color: var(--muted); font-size: 0.75rem; margin-top: 2rem; }

        .state-screen {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 70vh; text-align: center; color: var(--muted);
        }
        .spinner {
            width: 26px; height: 26px;
            border: 3px solid rgba(246,245,241,0.2);
            border-top-color: var(--mint);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="wrap" id="profile-container">
    <div class="state-screen">
        <div class="spinner"></div>
        <p>Loading profile…</p>
    </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const slug = (params.get('slug') || 'sample-store').replace(/[^a-zA-Z0-9\-_]/g, '');
const container = document.getElementById('profile-container');

function esc(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
}

fetch(`data/${slug}.json`)
    .then(res => { if (!res.ok) throw new Error('not found'); return res.json(); })
    .then(renderProfile)
    .catch(() => {
        container.innerHTML = `
            <div class="state-screen">
                <h1 style="font-family:'Fraunces',serif;font-size:2rem;color:var(--paper);">Not found</h1>
                <p>We couldn't find a profile for this link.</p>
            </div>`;
    });

function makeVCard(data) {
    const lines = [
        'BEGIN:VCARD',
        'VERSION:3.0',
        `FN:${data.business_name || ''}`,
        `TEL;TYPE=CELL:${data.phone || ''}`,
        `EMAIL:${data.email || ''}`,
        `ADR:;;${data.address || ''}`,
        `NOTE:${data.tagline || ''}`,
        'END:VCARD'
    ];
    return 'data:text/vcard;charset=utf-8,' + encodeURIComponent(lines.join('\n'));
}

function renderProfile(data) {
    document.title = data.business_name;

    const icons = [];
    if (data.phone) icons.push(`<a href="tel:${esc(data.phone)}" class="icon-badge"><i class="bi bi-telephone-fill"></i></a>`);
    if (data.social_links?.messenger) icons.push(`<a href="${esc(data.social_links.messenger)}" class="icon-badge"><i class="bi bi-messenger"></i></a>`);
    if (data.social_links?.whatsapp) icons.push(`<a href="${esc(data.social_links.whatsapp)}" class="icon-badge"><i class="bi bi-whatsapp"></i></a>`);
    if (data.social_links?.facebook) icons.push(`<a href="${esc(data.social_links.facebook)}" class="icon-badge"><i class="bi bi-facebook"></i></a>`);
    if (data.social_links?.instagram) icons.push(`<a href="${esc(data.social_links.instagram)}" class="icon-badge"><i class="bi bi-instagram"></i></a>`);
    if (data.social_links?.tiktok) icons.push(`<a href="${esc(data.social_links.tiktok)}" class="icon-badge"><i class="bi bi-tiktok"></i></a>`);
    if (data.google_review_link) icons.push(`<a href="${esc(data.google_review_link)}" class="icon-badge"><i class="bi bi-star-fill"></i></a>`);

    const galleryHtml = (data.gallery && data.gallery.length) ? `
        <div class="gallery">
            ${data.gallery.slice(0, 3).map(src => `<img src="${esc(src)}" alt="">`).join('')}
        </div>` : '';

    const services = (data.services || []).map(s => `
        <div class="list-row">
            <div class="icon"><i class="bi bi-check2"></i></div>
            <div>
                <div class="name">${esc(s.name)}</div>
                <div class="desc">${esc(s.description)}</div>
            </div>
        </div>`).join('');

    const mapsHtml = data.google_maps_embed ? `
        <section>
            <h2>Location</h2>
            <div class="map-frame">
                <div style="aspect-ratio:16/9;">
                    <iframe src="${esc(data.google_maps_embed)}" style="border:0;width:100%;height:100%;" allowfullscreen loading="lazy"></iframe>
                </div>
            </div>
        </section>` : '';

    container.innerHTML = `
        <div class="avatar-wrap"><img src="${esc(data.logo)}" alt="Logo" class="avatar"></div>
        <div class="identity">
            <h1>${esc(data.business_name)}</h1>
            ${data.role ? `<p class="role">${esc(data.role)}</p>` : ''}
            <p class="tagline">${esc(data.tagline)}</p>
        </div>

        <div class="icon-row">${icons.join('')}</div>

        ${galleryHtml}

        ${services ? `<section><h2>What We Offer</h2>${services}</section>` : ''}

        <section>
            <h2>Contact</h2>
            <div class="list-row"><div class="icon"><i class="bi bi-geo-alt-fill"></i></div><div>${esc(data.address)}</div></div>
            <div class="list-row"><div class="icon"><i class="bi bi-envelope-fill"></i></div><div>${esc(data.email)}</div></div>
        </section>

        ${mapsHtml}

        <a href="${makeVCard(data)}" download="${esc(data.business_name)}.vcf" class="save-btn">
            <i class="bi bi-person-plus-fill"></i> Save Contact
        </a>

        <footer>Powered by Digital Profile Card</footer>
    `;
}
</script>

</body>
</html>
