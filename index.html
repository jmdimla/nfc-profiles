<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div class="container py-4" id="profile-container" style="max-width: 500px;">
    <div class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="text-muted mt-2">Loading...</p>
    </div>
</div>

<script>
// ============================================================
// PROFILE PAGE (STATIC VERSION - para sa GitHub Pages)
// ============================================================
// Paano gamitin:
// 1. Gumawa ng bagong file sa /data/ folder, halimbawa: data/jollystore.json
// 2. Kopyahin lang ang laman ng data/sample-store.json, palitan ng info
// 3. Ang link na isusulat mo sa NFC card:
//    https://yourusername.github.io/yourrepo/index.html?slug=jollystore
// ============================================================

// Kunin ang slug mula sa URL (?slug=jollystore)
const params = new URLSearchParams(window.location.search);
const slug = (params.get('slug') || 'sample-store').replace(/[^a-zA-Z0-9\-_]/g, '');

const container = document.getElementById('profile-container');

// Simpleng function para i-escape ang text (basic security, parang htmlspecialchars sa PHP)
function esc(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
}

fetch(`data/${slug}.json`)
    .then(res => {
        if (!res.ok) throw new Error('not found');
        return res.json();
    })
    .then(data => renderProfile(data))
    .catch(() => {
        container.innerHTML = `
            <div class="text-center py-5">
                <h1 class="display-4">404</h1>
                <p class="text-muted">Walang nahanap na profile para dito.</p>
            </div>`;
    });

function renderProfile(data) {
    document.title = data.business_name;

    let servicesHtml = '';
    if (data.services && data.services.length) {
        servicesHtml = `
        <div class="card mb-4">
            <div class="card-header bg-white"><strong>Mga Alok Namin</strong></div>
            <ul class="list-group list-group-flush">
                ${data.services.map(s => `
                    <li class="list-group-item">
                        <strong>${esc(s.name)}</strong>
                        <div class="text-muted small">${esc(s.description)}</div>
                    </li>`).join('')}
            </ul>
        </div>`;
    }

    let mapsHtml = '';
    if (data.google_maps_embed) {
        mapsHtml = `
        <div class="card mb-4">
            <div class="ratio ratio-16x9">
                <iframe src="${esc(data.google_maps_embed)}" style="border:0;" allowfullscreen loading="lazy"></iframe>
            </div>
        </div>`;
    }

    let messengerBtn = data.social_links?.messenger
        ? `<a href="${esc(data.social_links.messenger)}" class="btn btn-outline-primary">
             <i class="bi bi-messenger"></i> Message sa Messenger</a>`
        : '';

    let reviewBtn = data.google_review_link
        ? `<a href="${esc(data.google_review_link)}" class="btn btn-warning">
             <i class="bi bi-star-fill"></i> Mag-iwan ng Google Review</a>`
        : '';

    let fbIcon = data.social_links?.facebook
        ? `<a href="${esc(data.social_links.facebook)}" class="text-primary"><i class="bi bi-facebook"></i></a>` : '';
    let igIcon = data.social_links?.instagram
        ? `<a href="${esc(data.social_links.instagram)}" class="text-danger"><i class="bi bi-instagram"></i></a>` : '';

    container.innerHTML = `
        <div class="text-center mb-4">
            <img src="${esc(data.logo)}" alt="Logo" class="rounded-circle mb-3"
                 style="width:120px;height:120px;object-fit:cover;">
            <h1 class="h3 mb-1">${esc(data.business_name)}</h1>
            <p class="text-muted">${esc(data.tagline)}</p>
        </div>

        <div class="d-grid gap-2 mb-4">
            <a href="tel:${esc(data.phone)}" class="btn btn-primary btn-lg">
                <i class="bi bi-telephone-fill"></i> Tumawag: ${esc(data.phone)}
            </a>
            ${messengerBtn}
            ${reviewBtn}
        </div>

        ${servicesHtml}

        <div class="card mb-4">
            <div class="card-header bg-white"><strong>Contact Info</strong></div>
            <div class="card-body">
                <p class="mb-2"><i class="bi bi-geo-alt-fill text-danger"></i> ${esc(data.address)}</p>
                <p class="mb-0"><i class="bi bi-envelope-fill text-secondary"></i> ${esc(data.email)}</p>
            </div>
        </div>

        ${mapsHtml}

        <div class="d-flex justify-content-center gap-3 mb-4 fs-3">
            ${fbIcon} ${igIcon}
        </div>

        <p class="text-center text-muted small">Powered by NFC Digital Profile Card</p>
    `;
}
</script>

</body>
</html>
