<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Profile Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<style>
  :root{
    --bg-deep:#060F0D;
    --bg-mid:#0E2621;
    --surface:rgba(245,243,238,0.05);
    --surface-hi:rgba(245,243,238,0.09);
    --border:rgba(245,243,238,0.10);
    --mint:#3ED9A6;
    --mint-dim:rgba(62,217,166,0.14);
    --gold:#E8B96A;
    --paper:#F5F3EE;
    --muted:rgba(245,243,238,0.60);
    --muted-2:rgba(245,243,238,0.38);
    --radius-lg:18px;
    --radius-md:14px;
    --radius-sm:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100vh;font-family:'Inter',sans-serif;background:var(--bg-deep);color:var(--paper);}
  body{
    background:
      radial-gradient(520px 420px at 12% 4%, rgba(62,217,166,0.16), transparent 60%),
      radial-gradient(460px 380px at 92% 22%, rgba(232,185,106,0.08), transparent 65%),
      linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-mid) 55%, var(--bg-deep) 100%);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:460px;margin:0 auto;padding:2.25rem 1.15rem 6.5rem;}

  /* ---------- identity ---------- */
  .avatar-wrap{display:flex;justify-content:center;margin-bottom:1rem;}
  .avatar-ring{
    width:104px;height:104px;border-radius:50%;padding:3px;
    background:conic-gradient(from 180deg, var(--mint), var(--gold), var(--mint));
    display:flex;align-items:center;justify-content:center;
  }
  .avatar-ring img, .avatar-ring .avatar-fallback{
    width:100%;height:100%;border-radius:50%;object-fit:cover;
    border:3px solid var(--bg-deep);
  }
  .avatar-fallback{
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg, var(--bg-mid), var(--bg-deep));
    font-family:'Fraunces',serif;font-size:2rem;font-weight:600;color:var(--mint);
  }

  .identity{text-align:center;margin-bottom:1.5rem;}
  .identity .name-row{display:flex;align-items:center;justify-content:center;gap:0.4rem;}
  .identity h1{font-family:'Fraunces',serif;font-weight:600;font-size:1.65rem;margin:0;line-height:1.15;}
  .identity .verified{color:var(--mint);font-size:1.05rem;flex-shrink:0;}
  .identity .role{color:var(--mint);font-size:0.82rem;font-weight:600;margin:0.35rem 0 0.3rem;letter-spacing:0.01em;}
  .identity .tagline{color:var(--muted);font-size:0.92rem;margin:0;line-height:1.5;max-width:340px;margin-inline:auto;}

  .hours-chip{
    display:inline-flex;align-items:center;gap:0.45rem;
    background:var(--surface);border:1px solid var(--border);border-radius:999px;
    padding:0.35rem 0.75rem;margin-top:0.7rem;font-size:0.76rem;font-weight:600;color:var(--paper);
  }
  .hours-chip .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .hours-chip .dot.on{background:var(--mint);box-shadow:0 0 6px 1px rgba(62,217,166,0.6);}
  .hours-chip .dot.off{background:rgba(245,243,238,0.35);}

  /* ---------- primary CTA (fixed bottom bar) ---------- */
  .sticky-cta{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    display:flex;justify-content:center;
    padding:1.1rem 1.15rem calc(1.1rem + env(safe-area-inset-bottom));
    background:linear-gradient(180deg, transparent, var(--bg-deep) 42%);
    pointer-events:none;
  }
  .sticky-cta .save-btn{max-width:calc(460px - 2.3rem);pointer-events:auto;}
  .save-btn{
    display:flex;align-items:center;justify-content:center;gap:0.5rem;
    width:100%;background:var(--mint);color:#06110E;font-weight:700;font-size:0.96rem;
    padding:0.9rem;border-radius:999px;text-decoration:none;border:none;
    box-shadow:0 8px 24px -8px rgba(62,217,166,0.45);
  }
  .save-btn:active{opacity:0.88;transform:scale(0.99);}

  /* ---------- quick actions ---------- */
  .quick-actions{display:flex;justify-content:center;gap:0.55rem;flex-wrap:wrap;margin-bottom:2rem;margin-top:1.5rem;}
  .qa{
    display:flex;flex-direction:column;align-items:center;gap:0.35rem;
    text-decoration:none;color:var(--paper);width:64px;
  }
  .qa .qa-icon{
    width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:var(--surface);border:1px solid var(--border);font-size:1.15rem;color:var(--mint);
    transition:background 0.15s ease, transform 0.1s ease;
  }
  .qa:active .qa-icon{transform:scale(0.92);background:var(--mint-dim);}
  .qa .qa-label{font-size:0.66rem;color:var(--muted);font-weight:500;text-align:center;}

  /* ---------- generic section ---------- */
  section{margin-bottom:1.9rem;}
  section h2{
    font-size:0.72rem;font-weight:700;color:var(--mint);margin:0 0 0.8rem;
    text-transform:uppercase;letter-spacing:0.07em;
  }

  /* ---------- gallery ---------- */
  .gallery{display:grid;grid-template-columns:1fr 1fr;gap:0.6rem;}
  .gallery button{
    position:relative;padding:0;border:none;background:none;cursor:pointer;
    border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border);
  }
  .gallery img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;}
  .gallery .cap{
    position:absolute;left:0;right:0;bottom:0;padding:0.5rem 0.6rem 0.4rem;
    background:linear-gradient(0deg, rgba(6,15,13,0.85), transparent);
    color:var(--paper);font-size:0.72rem;font-weight:600;text-align:left;
  }

  /* ---------- lightbox ---------- */
  .lightbox{
    position:fixed;inset:0;background:rgba(4,10,9,0.92);display:none;
    align-items:center;justify-content:center;z-index:50;padding:1.5rem;
  }
  .lightbox.open{display:flex;}
  .lightbox img{max-width:100%;max-height:80vh;border-radius:var(--radius-md);}
  .lightbox-close{
    position:absolute;top:1.25rem;right:1.25rem;width:38px;height:38px;border-radius:50%;
    background:var(--surface);border:1px solid var(--border);color:var(--paper);font-size:1.1rem;
  }

  /* ---------- services ---------- */
  .services-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.6rem;}
  .service-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
    padding:0.9rem;
  }
  .service-card.span-full{grid-column:1 / -1;display:flex;align-items:flex-start;gap:0.7rem;}
  .service-card.span-full .icon{margin-bottom:0;margin-top:0.1rem;}
  .service-card .icon{color:var(--mint);font-size:1.1rem;margin-bottom:0.55rem;display:block;}
  .service-card .name{font-weight:600;font-size:0.88rem;margin-bottom:0.25rem;}
  .service-card .desc{color:var(--muted);font-size:0.78rem;line-height:1.4;}

  /* ---------- list rows (social + contact) ---------- */
  .row-list{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;}
  .row{
    display:flex;align-items:center;gap:0.8rem;padding:0.85rem 1rem;
    text-decoration:none;color:var(--paper);border-bottom:1px solid var(--border);
  }
  .row:last-child{border-bottom:none;}
  a.row:active{background:var(--surface-hi);}
  .row .row-icon{
    width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    background:var(--mint-dim);color:var(--mint);font-size:0.95rem;
  }
  .row .row-body{flex:1;min-width:0;}
  .row .row-label{font-size:0.7rem;color:var(--muted-2);margin-bottom:0.1rem;}
  .row .row-value{font-size:0.9rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row .row-go{color:var(--muted-2);font-size:0.85rem;flex-shrink:0;}

  /* ---------- location ---------- */
  .location-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
    padding:1.4rem 1rem;text-align:center;
    background-image:
      linear-gradient(rgba(62,217,166,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(62,217,166,0.05) 1px, transparent 1px);
    background-size:18px 18px;
  }
  .location-card .pin{
    width:42px;height:42px;border-radius:50%;background:var(--mint-dim);color:var(--mint);
    display:flex;align-items:center;justify-content:center;margin:0 auto 0.7rem;font-size:1.1rem;
  }
  .location-card .addr{font-weight:600;font-size:0.92rem;margin-bottom:0.25rem;}
  .location-card .sub{color:var(--muted);font-size:0.8rem;margin-bottom:1rem;}
  .directions-link{
    display:inline-flex;align-items:center;gap:0.4rem;color:var(--mint);font-size:0.82rem;font-weight:600;
    text-decoration:none;
  }
  .map-frame{margin-top:1rem;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border);}

  footer{text-align:center;margin-top:2.25rem;}
  footer .brand{color:var(--muted);font-size:0.75rem;}
  footer .brand a{color:var(--mint);text-decoration:none;font-weight:600;}

  .state-screen{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:70vh;text-align:center;color:var(--muted);
  }
  .spinner{
    width:26px;height:26px;border:3px solid rgba(245,243,238,0.18);border-top-color:var(--mint);
    border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:1rem;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  @media (min-width:480px){
    .wrap{padding-top:3rem;}
  }
</style>
</head>
<body>

<div class="wrap" id="profile-container">
  <div class="state-screen">
    <div class="spinner"></div>
    <p>Loading profile…</p>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const slug = (params.get('slug') || 'sample-store').replace(/[^a-zA-Z0-9\-_]/g, '');
const container = document.getElementById('profile-container');

function esc(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function initials(name){
  if(!name) return '?';
  return name.trim().split(/\s+/).slice(0,2).map(w => w[0]).join('').toUpperCase();
}

fetch(`data/${slug}.json?t=${Date.now()}`, { cache: 'no-store' })
  .then(res => { if (!res.ok) throw new Error('not found'); return res.json(); })
  .then(renderProfile)
  .catch(() => {
    container.innerHTML = `
      <div class="state-screen">
        <h1 style="font-family:'Fraunces',serif;font-size:1.8rem;color:var(--paper);">Not found</h1>
        <p>We couldn't find a profile for this link.</p>
      </div>`;
  });

function makeVCard(data){
  const lines = [
    'BEGIN:VCARD',
    'VERSION:3.0',
    `FN:${data.business_name || ''}`,
    `TITLE:${data.role || ''}`,
    `TEL;TYPE=CELL:${data.phone || ''}`,
    `EMAIL:${data.email || ''}`,
    `ADR:;;${data.address || ''}`,
    `NOTE:${data.tagline || ''}`,
    'END:VCARD'
  ];
  return 'data:text/vcard;charset=utf-8,' + encodeURIComponent(lines.join('\n'));
}

function parseTimeToMinutes(str){
  const m = str.trim().match(/(\d{1,2}):(\d{2})\s*([AP]M)/i);
  if (!m) return null;
  let h = parseInt(m[1], 10) % 12;
  if (/PM/i.test(m[3])) h += 12;
  return h * 60 + parseInt(m[2], 10);
}

function getTodayHoursStr(hours){
  if (!hours) return null;
  if (typeof hours === 'string') return hours;
  const days = ['sun','mon','tue','wed','thu','fri','sat'];
  return hours[days[new Date().getDay()]] || null;
}

// Reads data.hours — either a single string used every day ("6:00 AM - 9:00 PM"),
// or an object keyed by sun/mon/tue/wed/thu/fri/sat, value "Closed" or a range string.
// Status is computed from the visitor's device clock.
function computeOpenStatus(data){
  const todayStr = getTodayHoursStr(data.hours);
  if (!todayStr) return null;
  if (/closed/i.test(todayStr)) return { open: false, text: 'Closed today' };

  const parts = todayStr.split(/[-–—]|(?:\bto\b)/i).map(s => s.trim()).filter(Boolean);
  if (parts.length < 2) return { open: null, text: todayStr };

  const openMin = parseTimeToMinutes(parts[0]);
  const closeMin = parseTimeToMinutes(parts[1]);
  if (openMin == null || closeMin == null) return { open: null, text: todayStr };

  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const isOpen = closeMin > openMin
    ? (nowMin >= openMin && nowMin < closeMin)
    : (nowMin >= openMin || nowMin < closeMin); // overnight range

  return {
    open: isOpen,
    text: isOpen ? `Open now · closes ${parts[1]}` : `Closed · opens ${parts[0]}`
  };
}

function mapsSearchLink(data){
  if (data.google_maps_link) return data.google_maps_link;
  if (data.address) return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(data.address)}`;
  return null;
}

function renderProfile(data){
  document.title = data.business_name || 'Digital Profile Card';

  const avatarHtml = data.logo
    ? `<img src="${esc(data.logo)}" alt="${esc(data.business_name)}"
         onerror="this.replaceWith(Object.assign(document.createElement('div'),
           {className:'avatar-fallback', innerHTML:'${esc(initials(data.business_name))}'}))">`
    : `<div class="avatar-fallback">${esc(initials(data.business_name))}</div>`;

  const directions = mapsSearchLink(data);
  const hoursStatus = computeOpenStatus(data);

  // Quick actions: call, message, whatsapp, directions, review
  const qa = [];
  if (data.phone) qa.push({href:`tel:${data.phone}`, icon:'bi-telephone-fill', label:'Call'});
  if (data.social_links?.messenger) qa.push({href:data.social_links.messenger, icon:'bi-messenger', label:'Message'});
  if (data.social_links?.whatsapp) qa.push({href:data.social_links.whatsapp, icon:'bi-whatsapp', label:'WhatsApp'});
  if (directions) qa.push({href:directions, icon:'bi-signpost-2-fill', label:'Directions'});
  if (data.google_review_link) qa.push({href:data.google_review_link, icon:'bi-star-fill', label:'Review'});
  const qaHtml = qa.map(a => `
    <a href="${esc(a.href)}" class="qa" target="_blank" rel="noopener">
      <span class="qa-icon"><i class="bi ${a.icon}"></i></span>
      <span class="qa-label">${esc(a.label)}</span>
    </a>`).join('');

  const galleryItems = (data.gallery || [])
    .map(g => typeof g === 'string' ? { src: g, caption: '' } : { src: g.src, caption: g.caption || '' })
    .slice(0, 4); // keep it curated, not a dump
  const galleryHtml = galleryItems.length ? `
    <section>
      <h2>Gallery</h2>
      <div class="gallery">
        ${galleryItems.map((item, i) => `
          <button type="button" onclick="openLightbox(${i})">
            <img src="${esc(item.src)}" alt="${esc(item.caption)}">
            ${item.caption ? `<span class="cap">${esc(item.caption)}</span>` : ''}
          </button>`).join('')}
      </div>
    </section>` : '';

  const serviceList = data.services || [];
  const services = serviceList.map((s, i) => {
    const spanFull = (serviceList.length % 2 === 1) && (i === serviceList.length - 1);
    return `
    <div class="service-card${spanFull ? ' span-full' : ''}">
      <span class="icon"><i class="bi bi-check-circle-fill"></i></span>
      <div>
        <div class="name">${esc(s.name)}</div>
        <div class="desc">${esc(s.description)}</div>
      </div>
    </div>`;
  }).join('');

  const socialMeta = {
    facebook:  {icon:'bi-facebook',  label:'Facebook'},
    instagram: {icon:'bi-instagram', label:'Instagram'},
    tiktok:    {icon:'bi-tiktok',    label:'TikTok'},
    linkedin:  {icon:'bi-linkedin',  label:'LinkedIn'},
    twitter:   {icon:'bi-twitter-x', label:'Twitter / X'},
    dribbble:  {icon:'bi-dribbble',  label:'Dribbble'},
    github:    {icon:'bi-github',    label:'GitHub'},
  };
  const socialRows = Object.entries(data.social_links || {})
    .filter(([key]) => socialMeta[key])
    .map(([key, url]) => `
      <a class="row" href="${esc(url)}" target="_blank" rel="noopener">
        <span class="row-icon"><i class="bi ${socialMeta[key].icon}"></i></span>
        <span class="row-body">
          <div class="row-label">${socialMeta[key].label}</div>
          <div class="row-value">${esc(url.replace(/^https?:\/\//,''))}</div>
        </span>
        <span class="row-go"><i class="bi bi-box-arrow-up-right"></i></span>
      </a>`).join('');

  const contactRows = `
    ${data.email ? `
      <a class="row" href="mailto:${esc(data.email)}">
        <span class="row-icon"><i class="bi bi-envelope-fill"></i></span>
        <span class="row-body">
          <div class="row-label">Email</div>
          <div class="row-value">${esc(data.email)}</div>
        </span>
        <span class="row-go"><i class="bi bi-box-arrow-up-right"></i></span>
      </a>` : ''}
    ${data.phone ? `
      <a class="row" href="tel:${esc(data.phone)}">
        <span class="row-icon"><i class="bi bi-telephone-fill"></i></span>
        <span class="row-body">
          <div class="row-label">Phone</div>
          <div class="row-value">${esc(data.phone)}</div>
        </span>
        <span class="row-go"><i class="bi bi-box-arrow-up-right"></i></span>
      </a>` : ''}
  `;

  const mapsEmbedHtml = data.google_maps_embed ? `
    <div class="map-frame">
      <div style="aspect-ratio:16/9;">
        <iframe src="${esc(data.google_maps_embed)}" style="border:0;width:100%;height:100%;" allowfullscreen loading="lazy"></iframe>
      </div>
    </div>` : '';

  const locationHtml = (data.address || data.google_maps_embed) ? `
    <section>
      <h2>Location</h2>
      <div class="location-card">
        <div class="pin"><i class="bi bi-geo-alt-fill"></i></div>
        ${data.address ? `<div class="addr">${esc(data.address)}</div>` : ''}
        ${directions ? `<a class="directions-link" href="${esc(directions)}" target="_blank" rel="noopener">
            Get directions <i class="bi bi-arrow-up-right"></i></a>` : ''}
        ${mapsEmbedHtml}
      </div>
    </section>` : '';

  container.innerHTML = `
    <div class="avatar-wrap"><div class="avatar-ring">${avatarHtml}</div></div>
    <div class="identity">
      <div class="name-row">
        <h1>${esc(data.business_name)}</h1>
        ${data.verified ? '<i class="bi bi-patch-check-fill verified" title="Verified by Tap & Co"></i>' : ''}
      </div>
      ${data.role ? `<p class="role">${esc(data.role)}</p>` : ''}
      ${data.tagline ? `<p class="tagline">${esc(data.tagline)}</p>` : ''}
      ${hoursStatus ? `<div class="hours-chip"><span class="dot ${hoursStatus.open === false ? 'off' : 'on'}"></span>${esc(hoursStatus.text)}</div>` : ''}
    </div>

    ${qaHtml ? `<div class="quick-actions">${qaHtml}</div>` : ''}

    ${socialRows ? `<section><h2>Connect</h2><div class="row-list">${socialRows}</div></section>` : ''}

    ${contactRows.trim() ? `<section><h2>Contact</h2><div class="row-list">${contactRows}</div></section>` : ''}

    ${services ? `<section><h2>What We Offer</h2><div class="services-grid">${services}</div></section>` : ''}

    ${galleryHtml}

    ${locationHtml}

    <footer>
      <p class="brand">Digital profile by <a href="https://www.facebook.com/tapandco" target="_blank" rel="noopener">Tap &amp; Co.</a></p>
    </footer>

    <div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
      <button class="lightbox-close" onclick="closeLightbox(event)"><i class="bi bi-x-lg"></i></button>
      <img id="lightbox-img" src="" alt="">
      <div id="lightbox-cap" style="position:absolute;bottom:2rem;left:0;right:0;text-align:center;color:var(--paper);font-size:0.85rem;"></div>
    </div>

    <div class="sticky-cta">
      <a href="${makeVCard(data)}" download="${esc(data.business_name)}.vcf" class="save-btn">
        <i class="bi bi-person-plus-fill"></i> Save Contact
      </a>
    </div>
  `;

  window.__gallery = galleryItems;
}

function openLightbox(i){
  const lb = document.getElementById('lightbox');
  const item = window.__gallery[i];
  document.getElementById('lightbox-img').src = item.src;
  document.getElementById('lightbox-cap').textContent = item.caption || '';
  lb.classList.add('open');
}
function closeLightbox(e){
  if (e.target.id === 'lightbox' || e.target.closest('.lightbox-close')) {
    document.getElementById('lightbox').classList.remove('open');
  }
}
</script>

</body>
</html>
