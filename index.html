<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        :root {
            --ink: #1B2A4A;
            --ink-deep: #14213D;
            --accent: #C9A24B;
            --paper: #F7F6F3;
            --line: #E4E1D9;
            --muted: #7A7668;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--paper);
            color: #2B2B2B;
        }
        .wrap { max-width: 460px; margin: 0 auto; padding-bottom: 3rem; }

        .cover {
            height: 130px;
            background: linear-gradient(135deg, var(--ink-deep) 0%, var(--ink) 55%, #3A4E7A 100%);
            position: relative;
        }
        .avatar-wrap {
            display: flex;
            justify-content: center;
            margin-top: -52px;
        }
        .avatar {
            width: 104px;
            height: 104px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--paper);
            background: #fff;
        }
        .identity {
            text-align: center;
            padding: 0.75rem 1.5rem 1.5rem;
        }
        .identity h1 {
            font-family: 'Fraunces', serif;
            font-weight: 600;
            font-size: 1.55rem;
            margin: 0 0 0.2rem;
            color: var(--ink-deep);
        }
        .identity p {
            margin: 0;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            padding: 0 1.5rem 1.75rem;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            border-radius: 8px;
            padding: 0.7rem 1rem;
            font-weight: 500;
            font-size: 0.95rem;
            text-decoration: none;
            border: 1px solid transparent;
            transition: opacity 0.15s ease;
        }
        .btn:active { opacity: 0.75; }
        .btn-call {
            background: var(--ink-deep);
            color: #fff;
        }
        .btn-outline {
            background: transparent;
            border-color: var(--line);
            color: var(--ink-deep);
        }
        .btn-review {
            background: var(--accent);
            color: #fff;
        }

        section {
            padding: 0 1.5rem 1.75rem;
        }
        section h2 {
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--ink-deep);
            margin: 0 0 0.9rem;
        }

        .list-row {
            display: flex;
            gap: 0.85rem;
            padding: 0.85rem 0;
            border-bottom: 1px solid var(--line);
        }
        .list-row:last-child { border-bottom: none; }
        .list-row .icon {
            color: var(--accent);
            font-size: 1.1rem;
            flex-shrink: 0;
            width: 22px;
            text-align: center;
            padding-top: 0.1rem;
        }
        .list-row .name { font-weight: 600; color: var(--ink-deep); }
        .list-row .desc { color: var(--muted); font-size: 0.9rem; margin-top: 0.1rem; }

        .map-frame {
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--line);
        }

        .socials {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            padding: 0.5rem 0 2rem;
            font-size: 1.4rem;
        }
        .socials a { color: var(--ink); }

        footer {
            text-align: center;
            color: var(--muted);
            font-size: 0.78rem;
            padding-top: 0.5rem;
        }

        .state-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            text-align: center;
            padding: 2rem;
            color: var(--muted);
        }
        .spinner {
            width: 28px; height: 28px;
            border: 3px solid var(--line);
            border-top-color: var(--ink-deep);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="wrap" id="profile-container">
    <div class="state-screen">
        <div class="spinner"></div>
        <p>Loading profile…</p>
    </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const slug = (params.get('slug') || 'sample-store').replace(/[^a-zA-Z0-9\-_]/g, '');
const container = document.getElementById('profile-container');

function esc(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
}

fetch(`data/${slug}.json`)
    .then(res => { if (!res.ok) throw new Error('not found'); return res.json(); })
    .then(renderProfile)
    .catch(() => {
        container.innerHTML = `
            <div class="state-screen">
                <h1 style="font-family:'Fraunces',serif;color:var(--ink-deep);font-size:2rem;">Not found</h1>
                <p>We couldn't find a profile for this link.</p>
            </div>`;
    });

function renderProfile(data) {
    document.title = data.business_name;

    const services = (data.services || []).map(s => `
        <div class="list-row">
            <div class="icon"><i class="bi bi-check2"></i></div>
            <div>
                <div class="name">${esc(s.name)}</div>
                <div class="desc">${esc(s.description)}</div>
            </div>
        </div>`).join('');

    const messengerBtn = data.social_links?.messenger
        ? `<a href="${esc(data.social_links.messenger)}" class="btn btn-outline"><i class="bi bi-messenger"></i>Message on Messenger</a>` : '';
    const reviewBtn = data.google_review_link
        ? `<a href="${esc(data.google_review_link)}" class="btn btn-review"><i class="bi bi-star-fill"></i>Leave a Google Review</a>` : '';
    const fbIcon = data.social_links?.facebook
        ? `<a href="${esc(data.social_links.facebook)}"><i class="bi bi-facebook"></i></a>` : '';
    const igIcon = data.social_links?.instagram
        ? `<a href="${esc(data.social_links.instagram)}"><i class="bi bi-instagram"></i></a>` : '';

    const mapsHtml = data.google_maps_embed ? `
        <section>
            <div class="map-frame">
                <div style="aspect-ratio:16/9;">
                    <iframe src="${esc(data.google_maps_embed)}" style="border:0;width:100%;height:100%;" allowfullscreen loading="lazy"></iframe>
                </div>
            </div>
        </section>` : '';

    container.innerHTML = `
        <div class="cover"></div>
        <div class="avatar-wrap">
            <img src="${esc(data.logo)}" alt="Logo" class="avatar">
        </div>
        <div class="identity">
            <h1>${esc(data.business_name)}</h1>
            <p>${esc(data.tagline)}</p>
        </div>

        <div class="actions">
            <a href="tel:${esc(data.phone)}" class="btn btn-call"><i class="bi bi-telephone-fill"></i>Call ${esc(data.phone)}</a>
            ${messengerBtn}
            ${reviewBtn}
        </div>

        ${services ? `<section><h2>What We Offer</h2>${services}</section>` : ''}

        <section>
            <h2>Contact</h2>
            <div class="list-row">
                <div class="icon"><i class="bi bi-geo-alt-fill"></i></div>
                <div class="name" style="font-weight:400;">${esc(data.address)}</div>
            </div>
            <div class="list-row">
                <div class="icon"><i class="bi bi-envelope-fill"></i></div>
                <div class="name" style="font-weight:400;">${esc(data.email)}</div>
            </div>
        </section>

        ${mapsHtml}

        <div class="socials">${fbIcon}${igIcon}</div>
        <footer>Powered by Digital Profile Card</footer>
    `;
}
</script>

</body>
</html>
