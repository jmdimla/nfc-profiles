<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Minimal custom styling on top of Bootstrap — just typography + a few polish touches */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f5f6f8;
        }
        .profile-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }
        .hero-avatar {
            width: 110px;
            height: 110px;
            object-fit: cover;
            border: 4px solid #fff;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
        }
        .section-label {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #6c757d;
        }
        .action-btn {
            border-radius: 10px;
            font-weight: 500;
            padding: 0.65rem 1rem;
        }
    </style>
</head>
<body>

<div class="container py-5" id="profile-container" style="max-width: 480px;">
    <div class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="text-muted mt-3 mb-0">Loading profile…</p>
    </div>
</div>

<script>
// ============================================================
// PROFILE PAGE (static version for GitHub Pages)
// ============================================================
// How to use:
// 1. Create a new file in the /data/ folder, e.g. data/jollystore.json
// 2. Copy the structure from data/sample-store.json and edit the values
// 3. The link to write on the NFC card:
//    https://yourusername.github.io/yourrepo/index.html?slug=jollystore
// ============================================================

const params = new URLSearchParams(window.location.search);
const slug = (params.get('slug') || 'sample-store').replace(/[^a-zA-Z0-9\-_]/g, '');

const container = document.getElementById('profile-container');

function esc(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
}

fetch(`data/${slug}.json`)
    .then(res => {
        if (!res.ok) throw new Error('not found');
        return res.json();
    })
    .then(data => renderProfile(data))
    .catch(() => {
        container.innerHTML = `
            <div class="text-center py-5">
                <h1 class="display-4 fw-bold">404</h1>
                <p class="text-muted">We couldn't find a profile for this link.</p>
            </div>`;
    });

function renderProfile(data) {
    document.title = data.business_name;

    let servicesHtml = '';
    if (data.services && data.services.length) {
        servicesHtml = `
        <div class="card profile-card mb-4">
            <div class="card-body">
                <p class="section-label mb-3">What We Offer</p>
                <div class="list-group list-group-flush">
                    ${data.services.map(s => `
                        <div class="list-group-item border-0 px-0 py-2">
                            <div class="fw-semibold">${esc(s.name)}</div>
                            <div class="text-muted small">${esc(s.description)}</div>
                        </div>`).join('')}
                </div>
            </div>
        </div>`;
    }

    let mapsHtml = '';
    if (data.google_maps_embed) {
        mapsHtml = `
        <div class="card profile-card mb-4 overflow-hidden">
            <div class="ratio ratio-16x9">
                <iframe src="${esc(data.google_maps_embed)}" style="border:0;" allowfullscreen loading="lazy"></iframe>
            </div>
        </div>`;
    }

    let messengerBtn = data.social_links?.messenger
        ? `<a href="${esc(data.social_links.messenger)}" class="btn btn-outline-primary action-btn">
             <i class="bi bi-messenger me-2"></i>Message on Messenger</a>`
        : '';

    let reviewBtn = data.google_review_link
        ? `<a href="${esc(data.google_review_link)}" class="btn btn-warning action-btn">
             <i class="bi bi-star-fill me-2"></i>Leave a Google Review</a>`
        : '';

    let fbIcon = data.social_links?.facebook
        ? `<a href="${esc(data.social_links.facebook)}" class="text-primary fs-4"><i class="bi bi-facebook"></i></a>` : '';
    let igIcon = data.social_links?.instagram
        ? `<a href="${esc(data.social_links.instagram)}" class="text-danger fs-4"><i class="bi bi-instagram"></i></a>` : '';

    container.innerHTML = `
        <div class="text-center mb-4">
            <img src="${esc(data.logo)}" alt="Logo" class="rounded-circle hero-avatar mb-3">
            <h1 class="h4 fw-bold mb-1">${esc(data.business_name)}</h1>
            <p class="text-muted mb-0">${esc(data.tagline)}</p>
        </div>

        <div class="d-grid gap-2 mb-4">
            <a href="tel:${esc(data.phone)}" class="btn btn-primary action-btn btn-lg">
                <i class="bi bi-telephone-fill me-2"></i>Call ${esc(data.phone)}
            </a>
            ${messengerBtn}
            ${reviewBtn}
        </div>

        ${servicesHtml}

        <div class="card profile-card mb-4">
            <div class="card-body">
                <p class="section-label mb-3">Contact Information</p>
                <p class="mb-2"><i class="bi bi-geo-alt-fill text-danger me-2"></i>${esc(data.address)}</p>
                <p class="mb-0"><i class="bi bi-envelope-fill text-secondary me-2"></i>${esc(data.email)}</p>
            </div>
        </div>

        ${mapsHtml}

        <div class="d-flex justify-content-center gap-4 mb-4">
            ${fbIcon} ${igIcon}
        </div>

        <p class="text-center text-muted small mb-0">Powered by Digital Profile Card</p>
    `;
}
</script>

</body>
</html>
